<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>开弓 · 古代开强弓试炼</title>
<style>
:root{
  --paper:#EFE6D3; --paper2:#E4D8BC; --ink:#3B322A; --brown:#78543C;
  --red:#9B4335; --gold:#D6B45A; --gold2:#B98F2E;
}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#221d19;font-family:"Songti SC","Noto Serif SC","STSong","SimSun",serif;color:var(--ink)}
#app{position:relative;width:100vw;height:100vh;height:100dvh;background:var(--paper);overflow:hidden;touch-action:none;cursor:default}
/* 竖屏提示条：不挡操作 */
#rotate{position:absolute;top:0;left:0;right:0;z-index:40;display:none;justify-content:center;padding:8px 0;
  background:rgba(23,19,16,.78);color:#e9dcc0;font-size:13px;letter-spacing:3px;pointer-events:none}
@media (orientation:portrait){#rotate{display:flex}#hud{top:30px}}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(48,41,36,.014) 0 1px,transparent 1px 3px),
             radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(48,41,36,.10) 100%)}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:radial-gradient(90% 80% at 50% 45%,transparent 46%,rgba(24,18,14,.85) 130%);transition:opacity .25s}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;padding:14px 22px;pointer-events:none}
#hud-level{font-size:17px;letter-spacing:3px;opacity:.85}
#hud-stamp{background:var(--red);color:#f6ecd6;font-size:19px;font-weight:700;letter-spacing:5px;
  padding:7px 12px 7px 16px;border-radius:4px;transform:rotate(-2.5deg);box-shadow:0 2px 0 rgba(48,41,36,.28)}
#hud-bow{font-size:17px;letter-spacing:2px;color:var(--brown);border-bottom:2px solid rgba(120,84,60,.5);padding-bottom:2px}
#mute{margin-left:auto;pointer-events:auto;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;
  background:transparent;color:var(--ink);font-family:inherit;font-size:15px;cursor:pointer;opacity:.75}
#mute.off{opacity:.32;text-decoration:line-through}

#hint{text-align:center;font-size:15px;font-weight:700;letter-spacing:3px;color:var(--ink);
  margin:0 0 8px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint:empty{display:none}

/* ---------- flash 文字 ---------- */
/* 玩家反馈频闪伤眼：换段提示改为纸签淡入淡出，不再缩放爆闪 */
#flash{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);z-index:11;font-size:21px;font-weight:700;
  letter-spacing:6px;color:var(--ink);background:rgba(246,239,220,.95);border:1.5px solid rgba(48,41,36,.6);
  padding:9px 20px 9px 26px;border-radius:4px;box-shadow:0 3px 10px rgba(48,41,36,.2);opacity:0;pointer-events:none}
#flash.show{animation:flashIn 1.15s ease-out}
@keyframes flashIn{0%{opacity:0}16%{opacity:.97}68%{opacity:.97}100%{opacity:0}}}

/* ---------- 场景 ---------- */
#stage{position:absolute;inset:0;z-index:1}
#stage svg{width:100%;height:100%;display:block}

/* ---------- NPC ---------- */
#bubble{position:absolute;left:4.5%;bottom:23.5%;z-index:9;max-width:240px;padding:10px 14px;font-size:15.5px;line-height:1.55;
  letter-spacing:1px;background:#f8f1df;border:2px solid var(--ink);border-radius:3px;box-shadow:3px 3px 0 rgba(48,41,36,.22);opacity:0;transition:opacity .18s}
#bubble.show{opacity:1}
#bubble::after{content:"";position:absolute;left:26px;bottom:-9px;width:14px;height:14px;background:#f8f1df;
  border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
#bubble.pop{animation:bpop .22s ease-out}
@keyframes bpop{0%{transform:scale(.92) translateY(3px)}100%{transform:scale(1)}}

/* ---------- 力量刻度（卷轴木尺） ---------- */
/* 玩家反馈"看不清"：提示与刻度并成一块题签式纸底面板，墨色统一 */
#meter{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:min(880px,94vw);z-index:10;pointer-events:none;
  background:rgba(246,239,220,.93);border:1.5px solid rgba(48,41,36,.55);border-radius:6px;
  box-shadow:0 3px 12px rgba(48,41,36,.25);padding:9px 16px 13px}
/* 标题/结算页显示时藏起整套游戏内 HUD：纸纱是半透明的，面板会透出来叠在标题文字上 */
#app.chrome-hidden #meter,#app.chrome-hidden #hud{display:none}
#stamrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px;font-weight:600;letter-spacing:2px;color:#46351f}
#stam{flex:1;max-width:420px;height:7px;border:1.5px solid var(--brown);border-radius:4px;overflow:hidden;background:rgba(120,84,60,.12)}
#stam i{display:block;height:100%;width:100%;background:var(--brown);border-radius:2px;transition:width .1s linear}
#scale{position:relative;height:46px;background:linear-gradient(#f7f0dd,#e8ddc2);border:2px solid rgba(48,41,36,.78);
  border-radius:3px;box-shadow:0 3px 0 rgba(48,41,36,.18)}
#zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#e2c46a,var(--gold));
  border-left:2.5px dashed var(--gold2);border-right:2.5px dashed var(--gold2)}
.zlab{position:absolute;top:1px;font-size:13px;font-weight:700;color:#3d2e0e;transform:translateX(-50%)}
.tick{position:absolute;bottom:0;width:1.5px;height:10px;background:rgba(48,41,36,.4)}
.tick.big{height:16px}
.tnum{position:absolute;bottom:16px;font-size:12px;font-weight:600;color:rgba(48,41,36,.88);transform:translateX(-50%)}
#cursor{position:absolute;top:-7px;bottom:-7px;width:4px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
/* 背景动效：慢推镜 / 流雾 / 过雁 */
@keyframes bgDrift{0%,100%{transform:scale(1.05) translate(0,0)}50%{transform:scale(1.09) translate(-9px,-5px)}}
#bgImg{transform-box:fill-box;transform-origin:center;animation:bgDrift 48s ease-in-out infinite}
@keyframes mistA{0%,100%{transform:translateX(-70px)}50%{transform:translateX(80px)}}
@keyframes mistB{0%,100%{transform:translateX(60px)}50%{transform:translateX(-70px)}}
#mist .m1{animation:mistA 30s ease-in-out infinite}
#mist .m2{animation:mistB 38s ease-in-out infinite}
#mist .m3{animation:mistA 45s ease-in-out infinite}
@keyframes flyBy{0%{transform:translate(-160px,150px)}100%{transform:translate(1160px,55px)}}
#birds{animation:flyBy 38s linear infinite;animation-delay:-18s}}
#cursor::after{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top:9px solid var(--ink)}
#pct{position:absolute;top:-40px;transform:translateX(-50%);font-size:24px;font-weight:700;letter-spacing:1px;color:var(--ink)}
#pct.near{color:var(--red)}

/* ---------- 横幅 ---------- */
#banner{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .18s}
#banner.show{opacity:1}
#banner h1{font-size:64px;letter-spacing:22px;text-indent:22px;color:var(--ink);text-shadow:0 3px 0 rgba(48,41,36,.14)}
#banner h1.red{color:var(--red);font-size:84px}
#banner .sub{margin-top:14px;font-size:20px;letter-spacing:8px;color:var(--brown)}
#banner .rule{margin-top:18px;width:220px;height:2px;background:var(--ink);opacity:.5}
#bannerSeal{display:none;margin-top:16px;width:54px;height:54px;line-height:56px;text-align:center;background:var(--red);
  color:#f6ecd6;font-size:30px;font-weight:700;border-radius:5px;transform:rotate(6deg);box-shadow:0 2px 0 rgba(48,41,36,.28)}
/* 节奏环反馈：描边颜色平滑过渡（原硬切闪色频闪伤眼） */
#ringBand{transition:stroke .25s ease}
#streak{font-size:21px;font-weight:700;letter-spacing:3px;fill:#8F3B2E;opacity:0;transition:opacity .3s ease}

/* ---------- 失败层 ---------- */
#fail{position:absolute;inset:0;z-index:13;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(48,41,36,.24);pointer-events:auto}
#fail.show{display:flex;animation:fin .18s ease-out}
@keyframes fin{from{opacity:0}to{opacity:1}}
#fail h2{font-size:58px;letter-spacing:14px;color:var(--ink);text-shadow:0 2px 0 var(--paper)}
#fail .why{margin-top:10px;font-size:17px;letter-spacing:3px;color:var(--paper);background:rgba(48,41,36,.72);padding:5px 16px;border-radius:3px}
.btn{pointer-events:auto;font-family:inherit;font-size:20px;letter-spacing:8px;text-indent:8px;padding:11px 30px;margin-top:26px;
  background:var(--ink);color:#f3e9d2;border:none;border-radius:6px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn.small{font-size:16px;padding:8px 20px;margin-top:14px}

/* ---------- 标题 / 结局 ---------- */
.screen{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--paper)}
/* 标题页半透纸纱，透出水墨校场背景；题签式竖排，压角章 */
#title{background:radial-gradient(115% 92% at 50% 40%, rgba(245,237,220,.88), rgba(232,221,196,.6))}
.screen.show{display:flex}
.screen.dark{background:#171310;color:#e9dcc0}
#title .big{display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateX(110px)}
#title .char{font-size:172px;line-height:.98;color:var(--ink);text-shadow:0 4px 0 rgba(48,41,36,.12)}
#title .seal{width:64px;height:64px;background:var(--red);color:#f6ecd6;display:flex;align-items:center;justify-content:center;
  font-size:34px;border-radius:5px;transform:rotate(7deg);align-self:flex-end;margin:14px 22px 0 0;box-shadow:0 2px 0 rgba(48,41,36,.3)}
#title .rule{margin-top:26px;width:250px;height:2px;background:var(--ink);opacity:.5;transform:translateX(110px)}
#title .tag{margin-top:16px;font-size:20px;letter-spacing:12px;text-indent:12px;color:var(--brown)}
#title .ops{margin-top:10px;font-size:13.5px;letter-spacing:3px;color:rgba(48,41,36,.6)}
#title .fine{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11.5px;color:rgba(48,41,36,.62);letter-spacing:1px}

#end h1{font-size:76px;letter-spacing:26px;text-indent:26px;color:var(--red);text-shadow:0 3px 0 rgba(48,41,36,.2)}
#end .card{margin-top:34px;background:#f6efdc;border:2.5px solid var(--ink);border-radius:6px;padding:26px 44px;
  box-shadow:6px 6px 0 rgba(0,0,0,.35);min-width:320px}
#end .row{display:flex;justify-content:space-between;gap:46px;font-size:19px;letter-spacing:4px;padding:7px 0;border-bottom:1px dashed rgba(48,41,36,.3)}
#end .row:last-child{border-bottom:none}
#end .row b{color:var(--red);font-size:21px}
#end .share{margin-top:22px;font-size:15px;letter-spacing:2px;color:var(--brown)}
#end .btn.ghost{color:#e9dcc0;border-color:#e9dcc0}
</style>
</head>
<body>
<div id="app">
  <div id="rotate">横屏体验更佳</div>
  <div id="stage">
    <svg id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E4D8BC"/><stop offset="1" stop-color="#D9CBAA"/>
        </linearGradient>
        <!-- 毛笔晕染：让 SVG 前景边缘带一点枯笔的呼吸感，融进水墨背景 -->
        <filter id="inkRough" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.024" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
        </filter>
      </defs>
      <g id="world">
        <!-- 水墨校场背景（生成图 art/bg-camp.jpg，暖米色调与 UI 同源） -->

/* 隐藏动态难度：按当前关连续失败次数叠加。绝不显示给玩家。 */
function computeDDA(f){
  const d = { widen:0, gain:1, decay:1, beatWin:1, staminaMul:1 };
  if (f >= 2) d.widen += 3;
  if (f >= 3) { d.gain *= 1.05; d.beatWin = 1.3; }
  if (f >= 4) d.decay *= 0.92;
  if (f >= 5) { d.widen += 4; d.beatWin = 1.7; }
  if (f >= 6) { d.gain *= 1.25; d.decay *= 0.75; d.widen += 9; d.beatWin = 2.6; d.staminaMul = 1.6; }
  return d;
}
/* 真实判定区 = 显示区。看到什么就是什么，绝无隐藏门槛。 */
function computeZone(L, dda){
  let min = L.zone[0], max = L.zone[1];
  // 射柳类准星关：慢手玩家首过误差固定（时间误差×准星速度），辅助放宽需比长按关更大才兜得住（in8 ≥85%）
  const w = L.mode === "aim" ? dda.widen * 1.7 : dda.widen;
  const cap = L.mode === "aim" ? 40 : 12;
  if (L.dynamicMin && dda.widen > 0) min = Math.max(L.dynamicMin, min - w);
  else min = Math.max(0, min - Math.min(w, cap));
  max = Math.min(100, max + Math.floor(Math.min(w, cap) / 2));
  return [min, max];
}
function beatWindows(L, dda){
  const cap = 0.46 * L.beat, k = L.winScale || 1;
  return { perfect: Math.min(cap, .06 * k * dda.beatWin), good: Math.min(cap, .20 * k * dda.beatWin) };
}
function beatQualityAt(t, L, dda){
  const w = beatWindows(L, dda);
  // 视觉：金环在半径中段（ph=0.5），圆环扩到金环的瞬间即节拍点，判定与视觉完全一致
  const ph = (t / L.beat) % 1;
  const d = Math.abs(ph - 0.5) * L.beat;
  return d <= w.perfect ? "perfect" : d <= w.good ? "good" : "norm";
}
function newRun(L, dda){
  return { p:0, maxP:0, t:0, stamina:L.stamina * dda.staminaMul,
    phase:"hold", lockT:0, bonusT:0, rebound:false, slowmoDone:false, done:false, lastQClick:-9 };
}
function passiveDecay(s, L, dda){
  if (L.mode === "hybrid" && s.phase === "rhythm") return L.lateDecay * dda.decay;
  let d = L.tapDecay * dda.decay;
  if (L.lateFrom && s.p > L.lateFrom) d *= (L.lateDecayMul || 1);
  return d;
}
/* 一次点击。返回：false=无效 / "rebound"=假回弹触发 / "zone"=进区成功 / true=普通 */
function doClick(s, L, dda, q){
  if (s.done) return false;
  if (L.mode === "hybrid" && s.phase === "hold") return false;
  let g;
  if (L.mode === "rhythm" || (L.mode === "hybrid" && s.phase === "rhythm")) {
    if (s.t - s.lastQClick < L.beat * .9) return false; // 节奏段一拍只认一击，乱点无收益
    s.lastQClick = s.t;
    if (L.mode === "hybrid") g = q === "perfect" ? L.rhythmBonus : q === "good" ? L.rhythmGood : L.rhythmNorm;
    else g = q === "perfect" ? L.perfectGain : q === "good" ? L.goodGain : L.tapGain;
  } else {
    g = L.tapGain;
    if (L.lateFrom && s.p > L.lateFrom) g *= L.lateTapMul;
  }
  g *= dda.gain;
  if (s.bonusT > 0 && L.fakeRebound) g *= L.fakeRebound.bonusMul;
  // hybrid 连点段力量封顶：到换拍线后必须跟圆环，不许连点磨过去
  const cap = (L.mode === "hybrid" && s.phase === "tap") ? L.switchRhythm : 100;
  s.p = clamp(s.p + g, 0, cap);
  if (L.mode === "hybrid" && s.phase === "tap" && s.p >= L.switchRhythm) s.phase = "rhythm";
  s.maxP = Math.max(s.maxP, s.p);
  if (s.p >= computeZone(L, dda)[0]) { s.done = true; return "zone"; }
  const fb = L.fakeRebound;
  if (fb && !s.rebound && s.p >= fb.triggerMin && s.p <= fb.triggerMax) {
    s.p = Math.max(0, s.p - fb.drop);
    s.rebound = true; s.bonusT = fb.bonusT;
    return "rebound";
  }
  return true;
}
/* 每帧推进。返回 null / "timeout" / "zone"（仅自动判定关）。 */
function stepRun(s, dt, L, dda, holding){
  if (s.done) return null;
  s.t += dt;
  s.bonusT = Math.max(0, s.bonusT - dt);
  let ev = null;
  if (L.mode === "hold" || L.mode === "hold2") {
    if (L.mode === "hold2") {
      if (s.phase === "hold") {
        s.p = holding ? clamp(s.p + L.holdGain * dda.gain * dt, 0, 100)
                      : Math.max(0, s.p - L.dropRate * dt);
        if (s.p >= L.lockAt) { s.p = L.lockAt; s.phase = "lock"; s.lockT = 0; }
      } else if (s.phase === "lock") {
        s.lockT += dt; s.p = L.lockAt;
        if (s.lockT >= L.lockDur) s.phase = "stage2";
      } else {
        const g = L.stage2Gain * dda.gain;
        const dec = s.p > L.lateFrom ? L.holdDecayLate * dda.decay : 0;
        s.p = holding ? clamp(s.p + (g - dec) * dt, 0, 100)
                      : Math.max(0, s.p - L.dropRate * dt);
      }
    } else {
      let g = L.holdGain * dda.gain;
      const rb = L.lateRebound;
      if (rb && s.p >= rb.from) g -= rb.rate;
      s.p = holding ? clamp(s.p + g * dt, 0, 100)
                    : Math.max(0, s.p - L.dropRate * dt);
    }
    s.maxP = Math.max(s.maxP, s.p);
  } else if (L.mode === "hybrid") {
    if (s.phase === "hold") {
      // dropRate 缺失会把 p 算成 NaN，全程报废（2026-09-30 真人实测踩中）
      s.p = holding ? clamp(s.p + L.holdGain * dda.gain * dt, 0, 100)
                    : Math.max(0, s.p - (L.dropRate || 0) * dt);
      if (s.p >= L.switchTap) s.phase = "tap";
    } else {
      s.p = Math.max(0, s.p - passiveDecay(s, L, dda) * dt);
    }
    s.maxP = Math.max(s.maxP, s.p);
  } else { // tap / rhythm
    s.p = Math.max(0, s.p - passiveDecay(s, L, dda) * dt);
    s.maxP = Math.max(s.maxP, s.p);
  }
  s.stamina -= dt;
  if (s.stamina <= 0) { s.done = true; return "timeout"; }
  if (L.mode === "tap" || L.mode === "rhythm" ||
     (L.mode === "hybrid" && s.phase !== "hold")) {
    if (s.p >= computeZone(L, dda)[0]) { s.done = true; return "zone"; }
  }
  return ev;
}
/* 长按关松手判定 */
function judgeHold(s, L, zone){
  if (s.p >= zone[0] && s.p <= zone[1]) return "win";
  return s.p < zone[0] ? "short" : "over";
}
function bandLine(maxP){
  if (maxP < 50) return "这弓好像不太认你。";
  if (maxP < 80) return "还有点远。";
  if (maxP < 90) return "快了。";
  return "差一点。";
}
/* 殿试准星位置（0~100 刻度） */
function aimPos(t, L){
  const w = 2 * Math.PI / L.aimPeriod;
  return clamp(L.targetCx + L.aimAmp * Math.sin(w * t) + L.aimB * Math.sin(3 * w * t + 1.2), 0, 100);
}
/*__PURE_END__*/

    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt).connect(g).connect(this.master);
    src.start(t0); src.stop(t0 + dur + .05);
  },
  tapClick(L){ const w = 300 - L.id * 16;
    this.tone(w, .05, { type:"triangle", vol:.16, slide:w*.6 });
    this.noise(.03, { vol:.1, f:1800, q:1 }); },
  beatTick(){ this.tone(820, .045, { type:"triangle", vol:.07 });
    this.noise(.02, { vol:.05, f:3000, q:2 }); },
  creakStart(){
    if (!this.ctx || this.creak) return;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf(); src.loop = true;
    const flt = this.ctx.createBiquadFilter(); flt.type = "bandpass"; flt.Q.value = 9; flt.frequency.value = 260;
    const g = this.ctx.createGain(); g.gain.value = 0;
    src.connect(flt).connect(g).connect(this.master); src.start();
    this.creak = { src, flt, g };
  },
  creakSet(p, active){
    if (!this.creak) return;
    const t = this.ctx.currentTime;
    this.creak.flt.frequency.setTargetAtTime(240 + p * 8.5, t, .05);
    this.creak.g.gain.setTargetAtTime(active ? Math.min(.16, .015 + p * .0018) : 0, t, .06);
  },
  creakStop(){ if (!this.creak) return;
    const c = this.creak; this.creak = null;
    c.g.gain.setTargetAtTime(0, this.ctx.currentTime, .04);
    setTimeout(() => { try{ c.src.stop(); }catch(e){} }, 300); },
  squeak(){ this.tone(500 + Math.random() * 700, .09, { type:"sawtooth", vol:.045, slide:900 + Math.random() * 500 }); },
  twang(){ // 弓弦释放：弦鸣 + 短促弹拨 + 空气声
    this.tone(230, .16, { type:"triangle", vol:.3, slide:62 });
    this.tone(322, .5, { type:"triangle", vol:.09, slide:308 });
    this.tone(329, .5, { type:"sine", vol:.07, slide:300 });
    this.noise(.09, { vol:.2, f:2600, q:1, slide:600 }); },
  whoosh(){ this.noise(.26, { vol:.24, f:800, q:1.4, slide:3600, type:"bandpass" }); },
  thock(){ // 中靶：木框闷响 + 草靶摩擦
    this.noise(.06, { vol:.5, f:340, q:1, type:"lowpass" });
    this.tone(140, .1, { vol:.3, slide:70 });
    this.noise(.16, { vol:.16, f:900, q:.7, type:"bandpass" }); },
  boing(){ this.tone(250, .3, { type:"sawtooth", vol:.16, slide:70 });
    this.noise(.08, { vol:.2, f:1200, q:2, slide:300 }); },
  drum(){ this.tone(82, .32, { vol:.5, slide:46 }); this.tone(160, .06, { vol:.14 }); },
  drum2(d=0){ this.tone(70, .4, { vol:.55, slide:42, delay:d }); },
  gong(){ [174, 261.5, 348, 466, 587].forEach((f, i) =>
    this.tone(f, 3.1 - i * .35, { vol:.17 - i * .02, slide:f * .988, delay:i * .02 })); },
  breath(){ this.noise(.5, { vol:.07, f:460, q:.8, type:"lowpass", slide:260 }); },
  snap(){ this.noise(.05, { vol:.3, f:2400, q:1.5, slide:500 }); },

  /* ---------------- 氛围配乐：沙场战鼓 + 号角 + 风声（程序化，无外部资源） ---------------- */
  musicOn:false, _musicTimer:null, _barN:0,
  musicStart(){
    if (!this.ctx || this.musicOn) return; this.musicOn = true;
    // 风声底噪：低通噪声 + 极慢呼吸起伏
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf(); src.loop = true;
    const flt = this.ctx.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 270; flt.Q.value = .4;
    const g = this.ctx.createGain(); g.gain.value = .026;
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = .06;
    const lg = this.ctx.createGain(); lg.gain.value = 120;
    lfo.connect(lg).connect(flt.frequency); lfo.start();
    src.connect(flt).connect(g).connect(this.master); src.start();
    this._musicTimer = setTimeout(() => this._bar(0), 1200);
  },
  _drumBoom(vol = .3, delay = 0){ // 战鼓闷芯：低频下潜 + 皮面拍击
    if (!this.ctx) return;
    this.tone(74, .45, { vol, slide: 42, delay });
    this.noise(.07, { vol: vol * .55, f: 210, q: .8, type: "lowpass", delay });
  },
  _drumSlap(vol = .15, delay = 0){ // 鼓边擦击
    if (!this.ctx) return;
    this.noise(.05, { vol, f: 520, q: 1, delay });
    this.tone(190, .05, { type: "triangle", vol: vol * .5, slide: 95, delay });
  },
  _horn(delay = 0){ // 号角：双簧管色叠五度，缓起长鸣
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay, dur = 2.6;
    [[146.8, .055], [220, .04], [147.6, .03]].forEach(([f, v]) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), fl = this.ctx.createBiquadFilter();
      o.type = "sawtooth"; o.frequency.value = f;
      fl.type = "lowpass"; fl.frequency.value = 950; fl.Q.value = .7;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.linearRampToValueAtTime(v, t0 + .3);
      g.gain.setValueAtTime(v, t0 + dur - .7);
      g.gain.linearRampToValueAtTime(.0001, t0 + dur);
      o.connect(fl).connect(g).connect(this.master); o.start(t0); o.stop(t0 + dur + .05);
    });
  },
  _bar(n){ // 战鼓点：一板一眼，每隔几小节变奏加花，号角隔八小节长鸣一声
    if (!this.ctx || !this.musicOn) return;
    this._drumBoom(.26);
    if (n % 4 === 3) { this._drumSlap(.13, .95); this._drumBoom(.18, 1.42); this._drumSlap(.1, 1.66); }
    else this._drumSlap(.12, .95);
    if (n % 8 === 5) this._horn(.4);
    this._musicTimer = setTimeout(() => this._bar(n + 1), 1900);
  },
};

/* ---------------- 关卡流程 ---------------- */
function saveUnlocked(){
  const n = Math.max(G.unlocked, G.lvlIndex + 2);

}
function refreshTitleButtons(){

}
function setChrome(v){ document.getElementById("app").classList.toggle("chrome-hidden", !v); }
/* 评级：甲（一次过）/ 乙（三次内）/ 丙（其余），只留最好的成绩 */
const GRADE_RANK = { "丙":1, "乙":2, "甲":3 };
function gradeOf(L){ const f = G.fails[L.id] || 0; return f === 0 ? "甲" : f <= 2 ? "乙" : "丙"; }
function recordGrade(L){
  const g = gradeOf(L), old = G.grades[L.id];
  if (!old || GRADE_RANK[g] > GRADE_RANK[old]) { G.grades[L.id] = g; store.set({ unlocked: G.unlocked, muted: G.muted, grades: G.grades }); }
}
function showSeal(L){

}
function showEnd(){
  const jia = Object.values(G.grades).filter(g => g === "甲").length;

  D.endJia.textContent = `${jia} / ${LEVELS.length} 关`;

  D.shareLine.textContent = `「我开了十石弓，${jia} 关甲等，你能开几石？」`;
}
function startGame(fromLevel){
  AU.ensure();
  setChrome(true);
  G.seqId++;
  G.lvlIndex = clamp((fromLevel || 1) - 1, 0, LEVELS.length - 1);
  D.title.classList.remove("show");
  startLevel();
}
function startLevel(){
  const L = cur();
  G.seqId++;
  G.state = "play";
  G.fails[L.id] = G.fails[L.id] || 0;
  resetAttempt();
  // HUD
  D.hudLevel.textContent = `第 ${G.lvlIndex + 1} / ${LEVELS.length} 关`;
  D.hudStamp.textContent = L.title;
  D.hudBow.textContent = L.bowName;
  D.hint.textContent = L.hint;
  // 场景
  setupBow(L);
  const aim = L.mode === "aim";
  D.targetG.style.display = aim ? "none" : "";
  D.willowG.style.display = aim ? "" : "none";
  D.ringG.style.display = (L.mode === "rhythm" || L.mode === "hybrid") ? "" : "none";
  D.stamTip.textContent = aim ? "臂力有限，看准再放" : "松手时机决定一切";
  D.vignette.style.opacity = 0;
  G.streak = 0;
  D.streak.style.opacity = 0;
  D.bannerSeal.style.display = "none";
  say(L.npcStart);
  banner(`第${["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五"][G.lvlIndex]}关`, `${L.title} · ${L.bowName}`);
  later(1300, hideBanner);
  later(4200, () => { if (G.state === "play" && !G.run.maxP) say(L.npcStart); });
}
function setupBow(L){
  const id = L.id, k = (id - 1) / 14;
  L._bowLen = 150 + id * 9;
  L._bowW = 4.5 + id * .9;
  const mix = (a, b) => Math.round(a + (b - a) * k);
  const c = `rgb(${mix(120,48)},${mix(84,41)},${mix(60,36)})`;
  D.limbT.setAttribute("stroke", c); D.limbB.setAttribute("stroke", c);
  D.limbT.setAttribute("stroke-width", L._bowW);
  D.limbB.setAttribute("stroke-width", L._bowW);
  D.grip.setAttribute("width", L._bowW + 6);
  D.grip.setAttribute("x", 505 - (L._bowW + 6) / 2);
}
function resetAttempt(){
  const L = cur();
  G.dda = computeDDA(G.fails[L.id]);
  G.zone = computeZone(L, G.dda);
  G.run = newRun(L, G.dda);
  G.holding = false; G.lastClick = -9; G.timeScale = 1; G.slowmoReal = 0;
  G.aimT = 0; G.fired = false; G.beatIdx = -1; G.breathT = 0;
  G._lockFlashed = G._s2Flashed = G._tapFlashed = G._rhFlashed = false;
  D.fail.classList.remove("show");
  G.arrowStuck = false;
  D.arrowG.style.display = "";
  D.arrowG.setAttribute("transform", "translate(0,0)");
  renderZone();
  AU.duck(false);
  AU.creakStart();
}
function renderZone(){
  const [a, b] = G.zone;
  D.zone.style.left = a + "%";
  D.zone.style.width = (b - a) + "%";
  D.zone.innerHTML = `<span class="zlab" style="left:6px;transform:none">${a}</span><span class="zlab" style="right:4px;transform:none">${b}</span>`;
}
function retry(){
  if (G.state !== "fail") return;
  G.state = "play";
  resetAttempt();
  const L = cur();
  if (L.mode !== "aim") say("");
  D.hint.textContent = L.hint;
}
function failReason(j, s){
  if (j === "over") return "过头了！收着点力。";
  const gap = G.zone[0] - s.p;
  if (gap <= 3) return "就差一点。";
  return bandLine(s.maxP);
}
function failAttempt(why){
  if (G.state !== "play") return;
  const L = cur();
  G.state = "fail";
  G.seqId++;
  G.fails[L.id] = (G.fails[L.id] || 0) + 1;
  G.shake = Math.max(G.shake, .45);
  AU.creakStop(); AU.boing(); AU.duck(false);
  G.timeScale = 1;
  const f = G.fails[L.id];
  const esc = f <= 1 ? "差一点。" : f <= 2 ? "再来。" : f <= 3 ? "刚才已经很接近了。" : f <= 4 ? "手别抖。" : "这次真能开。";
  say(L.npcFail || esc);
  D.failH.textContent = why;
  D.failWhy.textContent = f > 1 ? `第 ${f} 次尝试 · ${L.bowName}` : L.bowName;
  G.failReady = false;
  later(120, () => D.fail.classList.add("show"));
  later(340, () => G.failReady = true);
  // 弓弹回动画
  const r = G.run;
  addTween(.4, k => { r.p = r.p * (1 - k); });
}
function succeedAttempt(){
  if (G.state !== "play") return;
  const L = cur();
  G.state = "success";
  G.seqId++;
  G.timeScale = 1; G.slowmoReal = 0;
  AU.creakStop(); AU.duck(false);
  saveUnlocked();
  recordGrade(L);
  if (L.mode === "aim") return; // 射柳由 fireArrow 自己走演出
  // 成功停顿 0.1s → 松弦
  later(100, () => {
    G.holding = false;
    releaseArrow(880, () => {
      AU.thock(); AU.drum();
      G.shake = 1;
      G.arrowStuck = true; G.stuckX = 880; G.stuckY = 369; G.stuckAt = performance.now();
      say(L.npcWin || "");
      const goNext = () => { hideBanner(); if (G.state === "success") { G.lvlIndex++; startLevel(); } };
      banner(L.winBanner, L.npcAfter || "");
      showSeal(L);
      AU.drum2(.18);
      if (L.afterWin) later(1400, () => banner(L.afterWin, ""));
      later(L.afterWin ? 3000 : 1500, goNext);
    });
  });
}
function addTween(dur, fn, done){
  G.tweens.push({ t:0, dur, fn, done });
}
/* 箭从当前搭弓位置飞向 targetX，结束后回调 done */
function releaseArrow(targetX, done, targetY){
  AU.twang(); AU.whoosh();
  const L = cur();
  const tip = 505 - G.run.p / 100 * 76 + 106;
  const ty = targetY == null ? 0 : targetY - 378;
  addTween(.28, k => {
    const e = 1 - Math.pow(1 - k, 3);
    D.arrowG.setAttribute("transform", `translate(${(targetX - tip) * e},${ty * e})`);
  }, done);
}
function fireArrow(){
  if (G.fired || G.state !== "play") return;
  G.fired = true;
  const L = cur();
  const a = aimPos(G.aimT, L);
  G.run.p = 97; G.run.maxP = 100;
  const hit = a >= G.zone[0] && a <= G.zone[1];
  D.aimTgt.setAttribute("stroke", hit ? "#D6B45A" : "#9B4335");
  releaseArrow(882, () => {
    if (hit) {
      AU.thock(); AU.drum2(); AU.gong();
      G.shake = 1;
      G.arrowStuck = true; G.stuckX = 884; G.stuckY = 352; G.stuckAt = performance.now();
      saveUnlocked();
      recordGrade(L);
      say(L.npcWin || "");
      if (G.lvlIndex >= LEVELS.length - 1) {
        later(650, () => { showEnd(); setChrome(false); D.end.classList.add("show"); G.state = "end"; say(""); });
      } else {
        banner(L.winBanner, "");
        showSeal(L);
        later(1500, () => { hideBanner(); if (G.state !== "end") { G.lvlIndex++; startLevel(); } });
      }
    } else {
      AU.thock();
      const off = Math.abs(a - 50);
      G.arrowStuck = true; G.stuckX = 884 - (50 - a) * 5.3; G.stuckY = 352; G.stuckAt = performance.now();
      later(180, () => failAttempt(off < 8 ? "差之毫厘。" : "偏得离谱。"));
    }
  });
}

/* ---------------- 输入 ---------------- */
function press(){
  AU.ensure();
  if (G.state === "title") { startGame(G.unlocked); return; }
  if (G.state === "fail") { if (G.failReady) retry(); return; }
  if (G.state === "success") {
    // 允许点击跳过普通关的胜利演出；六石关与殿试演出不可跳过
    if (G.lvlIndex < 8) { hideBanner(); G.lvlIndex++; startLevel(); }
    return;
  }
  if (G.state !== "play") return;
  const L = cur(), s = G.run;
  if (L.mode === "aim") { fireArrow(); return; }
  if (L.mode === "hold" || L.mode === "hold2" || (L.mode === "hybrid" && s.phase === "hold")) {
    G.holding = true;
    return;
  }
  // tap / rhythm / hybrid(后段)
  const t = s.t;
  if (t - G.lastClick < 0.11) return;
  G.lastClick = t;
  let q = null;
  if (L.mode === "rhythm" || (L.mode === "hybrid" && s.phase === "rhythm")) q = beatQualityAt(t, L, G.dda);
  if (q) G.lastQ = { q, at: t };
  const r = doClick(s, L, G.dda, q);
  AU.tapClick(L);
  if (r === "zone") succeedAttempt();
  else if (r === "rebound") onRebound();
  else if (r === false && (L.mode === "rhythm" || s.phase === "rhythm") && s.t - (G.ignT || -9) > 1.2) { G.ignT = s.t; showFlash("一拍只点一下 · 圆环到金环时点"); }
}
function onRebound(){
  showFlash("弓一弹！");
  AU.snap(); AU.boing();
  G.shake = Math.max(G.shake, .7);
}
function release(){
  if (G.state !== "play") { G.holding = false; return; }
  const L = cur(), s = G.run;
  if (L.mode === "hold" || L.mode === "hold2") {
    G.holding = false;
    if (L.mode === "hold2" && s.phase === "lock") { failAttempt("手一软，脱了！"); return; }
    const j = judgeHold(s, L, G.zone);
    if (j === "win") succeedAttempt();
    else failAttempt(failReason(j, s));
  } else {
    // hybrid 按住段允许中途松手再按（松手只掉力，不判负）——2026-09-30 真人实测踩中
    G.holding = false;
  }
}

  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) press(); }
});
window.addEventListener("keyup", e => {
  if (e.code === "Space") { e.preventDefault(); release(); }
});
const app = $("app");
app.addEventListener("pointerdown", e => { e.preventDefault(); press(); });

app.addEventListener("pointercancel", release);

/* ---------------- 场景更新 ---------------- */
function heroPose(p, L, dt){
  if (!isFinite(p)) {
    // 防御：一次异常快照 + 拦截，绝不让 NaN 流进 SVG transform
    if (!G._nanSeen) { G._nanSeen = true; console.warn("KG NaN pose", JSON.stringify({ id: L && L.id, mode: L && L.mode, phase: G.run && G.run.phase, p: G.run && G.run.p, t: G.run && G.run.t, stam: G.run && G.run.stamina, holding: G.holding, state: G.state })); }
    return;
  }
  const tremorAmp = (L.tremor || 0) * (p > 60 ? (p - 60) / 40 : 0) * 2.6;
  const jx = (Math.random() - .5) * tremorAmp, jy = (Math.random() - .5) * tremorAmp;
  const lean = -p * 0.10;
  D.hero.setAttribute("transform", `translate(${408 - p * .12 + jx},${500 + jy}) rotate(${lean * .12} 0 -58)`);
  D.heroUpper.setAttribute("transform", `rotate(${lean} 0 -58)`);
  // 脚步滑动（马步间距随力量微宽）
  D.footB.setAttribute("x1", -40 - p * .06); D.footB.setAttribute("x2", -58 - p * .07);
  D.legB.setAttribute("x2", -40 - p * .06);
  D.footF.setAttribute("x1", 38 + p * .05); D.footF.setAttribute("x2", 56 + p * .05);
  D.legF.setAttribute("x2", 38 + p * .05);
  // 弓与弦
  const bowLen = L._bowLen || 159, d = p / 100 * 76; // 拉距恒定：人的臂展决定，弓大只体现在弓臂更长更弯
  const half = bowLen / 2;
  const tipY = half - d * .10, tipX = 505 - d * .30, cx = 505 - d * .55;
  D.limbT.setAttribute("d", `M505,378 Q${cx},${378 - half * .52} ${tipX},${378 - tipY}`);
  D.limbB.setAttribute("d", `M505,378 Q${cx},${378 + half * .52} ${tipX},${378 + tipY}`);
  const hx = 505 - d, hy = 378 - (p / 100) * 15; // 满弓时弦手提到腮边，不再平推
  D.string.setAttribute("points", `${tipX},${378 - tipY} ${hx},${hy} ${tipX},${378 + tipY}`);
  // 手臂：前手扶住弓把（由世界坐标 505,378 逆推上身旋转后的局部位置），后手拉弦
  // 双手按 heroUpper 旋转中心 (0,-58) 做逆变换：前手钉在世界弓把，后手钉在弦 Nock，不差一像素
  const th = lean * 1.12 * Math.PI / 180, cT = Math.cos(th), sT = Math.sin(th);
  const gy = -58;
  const raise = (p / 100) * 15;
  const gxF = 97 + p * .12, gyF = -122;          // 前手：弓把
  const gxR = 97 - d + p * .12, gyR = -122 - raise; // 后手：弦 Nock，满弓时收到下颔
  const fx = cT * gxF + sT * (gyF - gy);
  const fy = gy - sT * gxF + cT * (gyF - gy);
  const rx = cT * gxR + sT * (gyR - gy);
  const ry = gy - sT * gxR + cT * (gyR - gy);
  const armFD = `M18,-112 Q${(18 + fx) / 2 - 3},${(fy - 112) / 2 - 8} ${fx},${fy}`;
  D.armF.setAttribute("d", armFD); D.armFS.setAttribute("d", armFD);
  D.handF.setAttribute("cx", fx); D.handF.setAttribute("cy", fy);
  const armBD = `M-12,-110 Q${(rx - 12) * .35 - 2},${-92 - raise * .2} ${rx},${ry}`;
  D.armB.setAttribute("d", armBD); D.armBS.setAttribute("d", armBD);
  D.handB.setAttribute("cx", rx); D.handB.setAttribute("cy", ry);
  // 箭：未脱手时搭在弦上；中靶后钉在靶位（带短暂颤动）
  if (G.arrowStuck) {
    D.arrowG.setAttribute("transform", "translate(0,0)");
    D.arrowLine.setAttribute("x1", G.stuckX - 50); D.arrowLine.setAttribute("y1", G.stuckY + 9);
    D.arrowLine.setAttribute("x2", G.stuckX - 4); D.arrowLine.setAttribute("y2", G.stuckY + 1);
    D.arrowHead.setAttribute("d", `M${G.stuckX},${G.stuckY} l-12,-4 l4,9 Z`);
    D.arrowFletch.setAttribute("d", `M${G.stuckX - 46},${G.stuckY + 7.5} l9,-7 l1,12 Z M${G.stuckX - 36},${G.stuckY + 6} l9,-7 l1,12 Z`);
    const dt2 = performance.now() - (G.stuckAt || 0);
    D.arrowG.setAttribute("transform", `rotate(${Math.sin(dt2 / 26) * 3.2 * Math.exp(-dt2 / 240)} ${G.stuckX} ${G.stuckY})`);
    return;
  }
  D.arrowLine.setAttribute("x1", hx + 6); D.arrowLine.setAttribute("y1", hy + 3); D.arrowLine.setAttribute("x2", hx + 106); D.arrowLine.setAttribute("y2", hy + 3 + (378 - hy) * .4);
  D.arrowHead.setAttribute("d", `M${hx + 106},${hy + 3 + (378 - hy) * .4} l-11,-5 l0,10 Z`);
  D.arrowFletch.setAttribute("d", `M${hx + 10},${hy + 3} l8,-6 l0,12 Z M${hx + 20},${hy + 3} l8,-6 l0,12 Z`);
  // 脸红 / 汗 / 嘴
  D.faceRed.setAttribute("opacity", clamp((p - 78) / 30, 0, .5));
  D.sweat.setAttribute("opacity", p > 84 ? clamp((p - 84) / 22, 0, .7) : 0);
  D.mouth.setAttribute("d", p > 90 ? "M-7,-134 Q0,-127 7,-134" : p > 60 ? "M-6,-135 Q0,-131 6,-135" : "M-6,-136 Q0,-132 6,-136");
  return tremorAmp;
}
function updateCrowd(L, p){
  let want = 0;
  if (L.id === 8) want = 4 + Math.floor(p / 20);
  else if (L.id === 9) want = 5 + Math.floor(p / 8);
  else if (L.id === 10) want = 3;
  else if (L.id >= 6) want = 2;
  const have = D.crowd.childElementCount;
  if (want > have) for (let i = have; i < want; i++) {
    const gx = 620 + i * 31 + (i % 3) * 8;
    const gy = 470 + (i % 4) * 4;
    const g = el("g", { opacity:.8 });
    g.appendChild(el("circle", { cx:gx, cy:gy - 26, r:9, fill:"#3B322A" }));
    g.appendChild(el("path", { d:`M${gx - 13},${gy} Q${gx},${gy - 26} ${gx + 13},${gy} Z`, fill:"#3B322A" }));
    D.crowd.appendChild(g);
  }
  while (D.crowd.childElementCount > want) D.crowd.removeChild(D.crowd.lastChild);
}
function updateAim(){
  const L = cur();
  const a = aimPos(G.aimT, L);
  const x = 884 - (50 - a) * 5.3;
  D.crossV.setAttribute("x1", x); D.crossV.setAttribute("x2", x);
  D.cursor.style.left = a + "%";
  D.pct.textContent = Math.round(a) + "%";
  D.pct.style.left = a + "%";
  const inZone = a >= G.zone[0] && a <= G.zone[1];
  D.pct.classList.toggle("near", inZone);
  D.zone.style.opacity = 1;
  // 主角保持满弓姿态
  heroPose(97, L, 1/60);
  D.stamFill.style.width = clamp(G.run.stamina / L.stamina * 100, 0, 100) + "%";
}
function updateScene(dt){
  const L = cur(), s = G.run;
  if (L.mode === "aim") { updateAim(); return; }
  const p = s.p;
  heroPose(p, L, dt);
  // 刻度
  D.cursor.style.left = p + "%";
  D.pct.style.left = p + "%";
  D.pct.textContent = (p >= 99.95 ? 100 : p.toFixed(1)) + "%";
  D.pct.classList.toggle("near", p >= G.zone[0] - 4);
  D.stamFill.style.width = clamp(s.stamina / (L.stamina * G.dda.staminaMul) * 100, 0, 100) + "%";
  // 节奏环
  if (L.mode === "rhythm" || L.mode === "hybrid") {
    const show = L.mode === "rhythm" || s.phase === "rhythm";
    D.ringG.style.display = show ? "" : "none";
    if (show) {
      const ph = ((s.t % L.beat) + L.beat) % L.beat / L.beat;
      D.ringP.setAttribute("r", 26 + 54 * ph);
      D.ringP.setAttribute("opacity", .5 + .45 * (1 - ph));
      const w = beatWindows(L, G.dda);
      D.ringBand.setAttribute("r", 53);
      D.ringBand.setAttribute("stroke-width", Math.max(7, 54 * (w.perfect / L.beat) * 2));
      D.ringBand2.setAttribute("r", 53 + 27 * (w.good / L.beat));
      const bi = Math.floor((s.t + L.beat * .5) / L.beat); // 鼓点落在圆环扫过金环的瞬间
      if (bi !== G.beatIdx) { G.beatIdx = bi; AU.beatTick(); }
      // 点击质量反馈：不再硬切亮白（玩家反馈频闪伤眼），改柔和同系色 + CSS 平滑过渡
      if (G.lastQ && s.t - G.lastQ.at < .45) {
        D.ringBand.style.stroke = G.lastQ.q === "perfect" ? "#EAD9A8" : G.lastQ.q === "good" ? "#CDA85C" : "#B06A50";
      } else {
        D.ringBand.style.stroke = "#D6B45A";
      }
      // 连珠：perfect 连击计数（good 不断连，乱点才断），静态提示不闪烁
      if (G.lastQ && G._streakSeen !== G.lastQ.at) {
        G._streakSeen = G.lastQ.at;
        if (G.lastQ.q === "perfect") G.streak = (G.streak || 0) + 1;
        else if (G.lastQ.q === "norm") G.streak = 0;
        if (G.streak >= 3) { D.streak.textContent = `连珠 ×${G.streak}`; D.streak.style.opacity = .92; }
        else D.streak.style.opacity = 0;
      }
    }
  }
  // 阶段提示
  if (L.mode === "hold2") {
    if (s.phase === "lock" && !G._lockFlashed) { G._lockFlashed = true; showFlash("稳住——"); }
    if (s.phase === "stage2" && !G._s2Flashed) { G._s2Flashed = true; showFlash("再拉！"); }
  }
  if (L.mode === "hybrid") {
    if (s.phase === "tap" && !G._tapFlashed) { G._tapFlashed = true; showFlash("换：快速连点！"); D.hint.textContent = "快速连点 · 到 90 力量就会停"; }
    if (s.phase === "rhythm" && !G._rhFlashed) { G._rhFlashed = true; showFlash("换：圆环到金环时点！"); D.hint.textContent = "一拍一下 · 圆环扩到金环的那刻点击"; }
  }
  // 慢动作触发
  if (L.slowmoAt && p >= L.slowmoAt && !s.slowmoDone && !s.done) {
    s.slowmoDone = true;
    G.timeScale = .45; G.slowmoReal = .7;
    AU.duck(true);
  }
  // 吱呀声 & 呼吸
  AU.creakSet(p, G.holding || (L.mode !== "hold" && L.mode !== "hold2" && !s.done));
  if (p > 85 && Math.random() < dt * 2.2) AU.squeak();
  if (p >= 95 && L.mode !== "aim") {
    G.breathT -= dt;
    if (G.breathT <= 0) { G.breathT = 1.1; AU.breath(); }
  }
  // 背景压暗 / 围观
  const dark = L.id >= 7 ? clamp((p - 82) / 18, 0, 1) * .5 : (L.id === 6 ? clamp((p - 88) / 12, 0, 1) * .3 : 0);
  D.vignette.style.opacity = dark;
  updateCrowd(L, p);
}
function runTweens(rdt){
  for (let i = G.tweens.length - 1; i >= 0; i--) {
    const tw = G.tweens[i];
    tw.t += rdt;
    const k = clamp(tw.t / tw.dur, 0, 1);
    tw.fn(k);
    if (k >= 1) { G.tweens.splice(i, 1); if (tw.done) tw.done(); }
  }
}

/* ---------------- 主循环 ---------------- */
let last = performance.now();
function frame(now){
  const rdt = Math.min(.05, (now - last) / 1000);
  last = now;
  runTweens(rdt);
  G.shake *= Math.pow(.0001, rdt);
  const shk = G.shake > .02 ? G.shake * 9 : 0;
  D.world.setAttribute("transform", `translate(${(Math.random()-.5)*shk},${(Math.random()-.5)*shk})`);
  if ((G.state === "play" || G.state === "success") && G.run) {
    if (G.state === "play") {
      if (G.slowmoReal > 0) { G.slowmoReal -= rdt; if (G.slowmoReal <= 0) { G.timeScale = 1; AU.duck(false); } }
      const L = cur();
      if (L.mode !== "aim") {
        const ev = stepRun(G.run, rdt * G.timeScale, L, G.dda, G.holding);
        if (ev === "timeout") failAttempt("气力竭了。");
        else if (ev === "zone") succeedAttempt();
        else updateScene(rdt * G.timeScale);
      } else {
        G.aimT += rdt;
        G.run.stamina -= rdt;
        if (G.run.stamina <= 0 && !G.fired) { G.run.stamina = .01; failAttempt("手臂酸了。"); }
        else updateScene(rdt);
      }
    } else {
      updateScene(rdt); // 成功演出期间保持姿态
    }
  }
  requestAnimationFrame(frame);
}

/* ---------------- 启动 ---------------- */
refreshTitleButtons();
setChrome(false); // 初始停在标题页，游戏内 HUD 藏起
if (G.unlocked > 1) {
  $("btnStart").textContent = `继续 · 第${G.unlocked}关`;
  $("btnReset").style.display = "";
}
requestAnimationFrame(frame);

// 调参 / 调试入口（pose/scene 供无头验收静态渲染）
window.__KG = { G, LEVELS, AU, pose: heroPose, scene: updateScene, setupBow };
})();
</script>
