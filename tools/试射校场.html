<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开弓 · 十章试射</title><style>*{box-sizing:border-box}body{margin:0;background:#ded6c1;color:#292b23;font-family:system-ui}main{max-width:650px;margin:auto;background:#f2e9d6;min-height:100dvh;padding:22px}header{display:flex;justify-content:space-between;align-items:center}a{color:inherit}h1{font-size:26px;margin:0}p{line-height:1.6}select,button{font:inherit}select{width:100%;padding:12px;background:#f2e9d6;border:2px solid #292b23}canvas{width:100%;display:block}#detail{font-size:14px}#feedback{min-height:28px;color:#b43d2f;font-weight:bold}#meter{height:28px;border:2px solid #292b23;position:relative;overflow:hidden}#red,#gold{position:absolute;height:100%;background:#b43d2f88}#gold{background:#e5b63c}#needle{position:absolute;height:100%;width:3px;background:#292b23}#draw{width:100%;padding:18px;margin-top:18px;background:#b43d2f;color:#f2e9d6;border:2px solid #292b23;font-size:21px;touch-action:none;user-select:none}#draw:disabled{opacity:.6}small{display:block;margin:12px 0;color:#746f60}#power{float:right}main{max-width:480px;background:#f8f4e8;padding:18px 22px}body{background:#e3eadd;color:#654a35}h1{font-size:19px}header a{font-size:12px}main>p:first-of-type{font-size:11px;color:#92917e}select{border:1px solid #dedfcd;border-radius:12px;background:#fffaf0;padding:10px;font-size:12px}canvas{height:48svh;margin:0 -22px;width:calc(100% + 44px)}#detail{font-size:11px;color:#8b947d;margin:12px 0}#feedback{font-size:12px;margin:10px 0;min-height:18px}small{font-size:10px}#meter{height:18px;border:0;background:#e4e7d8;border-radius:8px}#draw{border:0;border-radius:16px;background:#b96550;box-shadow:0 4px 0 #98533e;font-size:17px;padding:15px;margin-top:12px}#power{font-size:11px}@media(max-height:650px){canvas{height:39svh}main{padding-top:12px}small{margin:8px 0}}</style><main><header><h1>开弓 · 十章试射</h1><a href="../">回主闯关</a></header><p>直接体验不同阶段，不计官阶、不改存档。</p><select id="chapter" aria-label="选择试射章节"></select><p id="detail"></p><canvas width="1000" height="720" aria-label="试射场景"></canvas><p id="feedback" aria-live="polite">按住拉弓，松手出箭。</p><span id="power">0%</span><small>红区命中 · 金区神射 · 虚线显示预计落点</small><div id="meter"><i id="red"></i><i id="gold"></i><b id="needle"></b></div><button id="draw">按住拉弓 · 松手出箭</button><small>远靶有下坠；移动靶看箭到达时的位置；骑射看马步。</small></main><script type="module">
import {makeBow,makeDraw,advanceDraw,zoneAt,judge,CHAPTERS} from '../engine.mjs?v=crowd-clear-1';import {drawScene} from '../scene.mjs?v=crowd-clear-1';
const $=id=>document.getElementById(id),g=document.querySelector('canvas').getContext('2d'),levels=[0,8,12,17,21,29,34,39,44,49];levels.forEach((n,i)=>$('chapter').add(new Option(`${i+1}. ${CHAPTERS[i]} · 第${n+1}关`,n)));let b,d,holding=false,outcome=null,shot=null,age=0,last=performance.now(),t=0;
function reset(){b=makeBow(Number($('chapter').value),'trial');d=makeDraw();holding=false;outcome=null;shot=null;age=0;$('draw').disabled=false;$('detail').textContent=`${b.bowName} · ${b.distance}步 · ${b.mounted?'骑马射箭':b.moving?'移动目标':'固定目标'}`;$('feedback').textContent=b.mounted?'马步改变出箭高度，抓住平稳时机。':b.moving?'目标还会继续移动，瞄的是箭到达的位置。':'同样的力道，距离和弓力会改变落点。';}
function hold(){if(outcome)return;holding=true;}
function release(cancel=false){if(!holding)return;holding=false;if(cancel){d=makeDraw();return;}const r=judge(b,d.power,d);outcome=r.kind;shot=r.impact;age=0;$('draw').disabled=true;$('feedback').textContent=r.kind==='perfect'?'神射 · 正中金心！':r.kind==='good'?'中了 · 命中外围红环':r.kind==='short'?'落低了，再多拉一点。':'越过了，下次早一点放。';}
$('chapter').onchange=reset;$('draw').onpointerdown=e=>{e.preventDefault();$('draw').setPointerCapture(e.pointerId);hold();};$('draw').onpointerup=()=>release();$('draw').onpointercancel=()=>release(true);window.onblur=()=>release(true);window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===$('draw')){e.preventDefault();if(!e.repeat)hold();}});window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();release();}});
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;if(outcome){age+=dt;if(age>1.5)reset();}else{advanceDraw(d,b,dt,holding);if(d.power>=102)release();}const z=zoneAt(b,d);for(const [id,min,max] of [['red',z.min,z.max],['gold',z.perfectMin,z.perfectMax]]){$(id).style.left=min+'%';$(id).style.width=(max-min)+'%';}$('needle').style.left=Math.min(100,d.power)+'%';$('power').textContent=Math.round(d.power)+'%';drawScene(g,{power:d.power,t,bow:b,draw:d,shot,outcome,age,hits:b.index,shapeScale:g.canvas.clientWidth*720/(g.canvas.clientHeight*1000)});requestAnimationFrame(loop);}reset();requestAnimationFrame(loop);
</script></html>
